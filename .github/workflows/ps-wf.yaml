name: Apigee Platform CI

on:
  push:
    branches:
      - feature-adarsha
      - release

jobs:
  apigee-ci:
    uses: ForgeCrux/pipeline-template/.github/workflows/apigee.yaml@main
    permissions:
      contents: read
      id-token: write

    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      PROB_SERVICE_TOKEN_URL: ${{ secrets.PROB_SERVICE_TOKEN_URL }}
      PROB_SERVICE_TOKEN_CLIENT_ID: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_ID }}
      PROB_SERVICE_TOKEN_CLIENT_SECRET: ${{ secrets.PROB_SERVICE_TOKEN_CLIENT_SECRET }}
      PROB_SERVICE_TOKEN_TENANT_ID: ${{ secrets.PROB_SERVICE_TOKEN_TENANT_ID }}
      CICD_PROFILE_ID: ${{ secrets.CICD_PROFILE_ID }}
      FLOW_CHANGE_ID: ${{ secrets.FLOW_CHANGE_ID }}
      RESOURCE_ID: ${{ secrets.RESOURCE_ID }}
      FLOW_TYPE: ${{ secrets.FLOW_TYPE }}

    with:
      apigee_org: gen-ai-poc-onboarding
      apigee_env: dev
      deploy_proxy: user-management-api
      resourcetype: apis
      branch_name: ${{ github.ref_name }}
